name: Validate problem difficulty

on:
  pull_request:
    branches:
      - main
    paths:
      - "leetcode-patterns/src/data/patterns.ts"
      - "leetcode-difficulty.json"
      - "validate_difficulty.py"
      - "fetch_leetcode_difficulty.py"
      - ".github/workflows/validate-difficulty.yml"
  schedule:
    # Daily at 09:30 UTC (off-peak for GH Actions)
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # On PR: run the validator against the committed snapshot.
  # No network call, fails fast if patterns.ts disagrees with the snapshot.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: python3 validate_difficulty.py

  # On cron / manual: refresh the snapshot from the LeetCode API,
  # auto-fix any drift in patterns.ts, and open a PR if anything changed.
  refresh-and-pr:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh snapshot from LeetCode
        run: python3 fetch_leetcode_difficulty.py

      - name: Auto-fix patterns.ts
        run: python3 validate_difficulty.py --fix

      - name: Open PR if drift detected
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: refresh LeetCode difficulty snapshot"
          title: "chore: refresh LeetCode difficulty snapshot"
          body: |
            Automated refresh of `leetcode-difficulty.json` from the LeetCode public problems API,
            plus any auto-corrections to `leetcode-patterns/src/data/patterns.ts` where our
            recorded difficulty drifted from upstream.

            Generated by `.github/workflows/validate-difficulty.yml`.
          branch: chore/refresh-leetcode-difficulty
          delete-branch: true
          add-paths: |
            leetcode-difficulty.json
            leetcode-patterns/src/data/patterns.ts
