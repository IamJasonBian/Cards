name: Run CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-leetcode-patterns:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leetcode-patterns
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: leetcode-patterns/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify judge harness
        run: npm run verify-harness
      - name: Build
        run: npm run build
