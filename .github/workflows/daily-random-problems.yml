name: Daily Random Problems

on:
  schedule:
    # Runs every day at 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leetcode-patterns
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch daily random problems
        run: node scripts/fetch-daily-problems.mjs

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain public/daily-problems.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/daily-problems.json
            git commit -m "Refresh daily random problems"
            git push
          else
            echo "No changes to daily-problems.json"
          fi
