[build]
  base = "leetcode-patterns"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Bundle the full problem JSONs (with hidden cases) into the function deploy.
  # These never reach the client — only the function reads them.
  included_files = ["server/problems/**"]

[dev]
  command = "npm run dev -- --port 5180 --strictPort"
  targetPort = 5180
  port = 8888
  framework = "#custom"

# SPA fallback — applied AFTER function routing via config.path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every served document. Permissions-Policy disables APIs
# we never use, but intentionally leaves `camera` enabled — the image-capture
# feature relies on getUserMedia in the browser.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=()"

# Vite emits content-hashed filenames under /assets — safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static problem JSON changes on each rebuild — cache but always revalidate.
[[headers]]
  for = "/problems/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
