[build]
  base = "leetcode-patterns"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev -- --port 5180 --strictPort"
  targetPort = 5180
  port = 8888
  framework = "#custom"

# SPA fallback — applied AFTER function routing via config.path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
