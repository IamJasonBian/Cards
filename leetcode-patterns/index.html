<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Wallpaper request chain: listing via GitHub API, image via wsrv.nl.
         Preconnecting saves DNS+TLS setup on the critical background path. -->
    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <link rel="preconnect" href="https://wsrv.nl" />
    <!-- If the previous visit prefetched next visit's wallpaper (see
         src/lib/wallpaper.ts), start loading it before the JS bundle is even
         requested — the background then paints with zero waterfall. -->
    <script>
      try {
        var wallpaperNext = localStorage.getItem("wallpaper:next:v1");
        if (wallpaperNext) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = wallpaperNext;
          document.head.appendChild(link);
        }
      } catch (e) {
        /* storage disabled — first-visit path handles it */
      }
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <title>leetcode-patterns</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
